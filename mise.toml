[tools]
go = "1.24.0"
cmake = "3.29.9"
ninja = "1.12.1"
clang = "17.0.6"

[env]
PATH = "{{env.HOME}}/go/bin:{{env.PATH}}"

[tasks.install]
run = "go install github.com/lucasew/workspaced/cmd/workspaced@latest && cmake -S . -B build -G Ninja"
description = "Install dependencies (workspaced, cmake)"

[tasks.codegen]
run = "echo 'No codegen steps defined.'"
description = "Update generated code"

[tasks.lint]
run = "workspaced codebase lint"
description = "Lint the codebase"

[tasks.fmt]
run = "workspaced codebase format"
description = "Format the codebase"

[tasks.build]
run = "cmake -S . -B build -G Ninja && cmake --build build"
description = "Build the project"

[tasks.test]
run = "cmake --build build && ctest --test-dir build --output-on-failure"
description = "Build and run tests"

[tasks.ci]
depends = ["lint", "test"]
description = "Run CI pipeline"
